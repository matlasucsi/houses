<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>House Points</title>
  <style>
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1em;
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #ddd;
      color: white;
      font-size: 1.2em;
    }

    .house-row {
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="cc_embed_houses"></div>

  <script>
    const orgID = 4910; // Replace with your organization ID if different

    // Mapping of house names to colors
    const houseColorMap = {
      "Amber": "yellow",
      "Zamrud": "green",
      "Delima": "red",
      "Nilam": "blue"
    };

    fetch(`https://crittercoinapi.azurewebsites.net/api/GetHouses?orgid=${orgID}&realtime=true`)
      .then(response => response.json())
      .then(data => {
        if (data.Houses && data.Houses.length) {
          // Sort houses by score in descending order
          data.Houses.sort((a, b) => (b.Score || 0) - (a.Score || 0));

          let html = "<table><tbody>";
          data.Houses.forEach((house) => {
            let houseName = house.Name
              ? house.Name.charAt(0).toUpperCase() + house.Name.slice(1).toLowerCase()
              : "House";

            // Replace "Ambar" with "Amber"
            if (houseName === "Ambar") houseName = "Amber";

            const backgroundColor = houseColorMap[houseName] || "gray";

            html += `<tr class="house-row" style="background-color: ${backgroundColor};">
              <td class="house-name">${houseName}</td>
              <td class="house-score">${house.Score || 0}</td>
            </tr>`;
          });
          html += "</tbody></table>";

          document.getElementById("cc_embed_houses").innerHTML = html;
        }
      })
      .catch(console.error);
  </script>
</body>
</html>
